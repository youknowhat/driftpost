/* ---------- 오류 ---------- */
function viewFatal(msg){
  dock.hidden=true; ctx.showBoat=true;
  const b=el("div","col");
  b.innerHTML=`<div class="label">OFFLINE</div>
    <h1 class="title" style="font-size:clamp(20px,4.4vw,26px)">바다에 닿지 못했어요</h1>
    <p class="lede">${esc(msg)}</p>
    <p class="muted">잠시 뒤 새로고침하면 대개 돌아옵니다.</p>`;
  const r=el("div","row"); const rb=el("button","btn primary","다시 시도");
  rb.onclick=()=>location.reload(); r.appendChild(rb); b.appendChild(r);
  show(win("연결 · CONNECTION", b));
}

/* 보던 화면으로 정확히 되돌아간다 (편지를 읽다 '?' 를 눌러도 자리를 잃지 않게) */
function goBack(fallback){
  const b=ctx.back;
  if(b && typeof b==="object" && b.screen){
    screen=b.screen; ctx=b.ctx||{}; render(); return;
  }
  go(typeof b==="string" ? b : (fallback || (board&&board.registered ? "home" : "intro")));
}

/* ---------- 라우터 ---------- */
function render(){
  const chip=$("#portChip");
  if(board&&board.registered) chip.innerHTML="<b>"+esc(board.sailor.port)+"</b>";
  else chip.textContent="";
  switch(screen){
    case "intro":    viewIntro(); break;
    case "port":     viewPort(); break;
    case "nick":     viewNick(); break;
    case "home":     viewHome(); break;
    case "compose":  viewCompose(); break;
    case "launched": viewLaunched(); break;
    case "mine":     viewMine(); break;
    case "read":     viewRead(); break;
    case "voyage":   viewVoyage(); break;
    case "log":      viewLog(); break;
    case "key":      viewKey(); break;
    case "claim":    viewClaim(); break;
    case "about":    viewAbout(); break;
    default:         viewIntro();
  }
}

/* ---------- 1초마다 남은 시간만 갱신 ---------- */
function tick(){
  const eta=$("#etaText");
  if(eta && ctx._chart && ctx._chart.g && ctx._chart.g.at){
    const g=ctx._chart.g;
    const left=g.at-now();
    eta.textContent = left>0 ? fmtDur(left)+" 남음" : "곧 도착합니다";
    const total=Math.max(1,g.at-g.from);
    const p=clamp((now()-g.from)/total,0,1);
    const fill=$(".gauge i"), knob=$(".gauge b");
    if(fill) fill.style.width=(p*100).toFixed(2)+"%";
    if(knob) knob.style.left=(p*100).toFixed(2)+"%";
    const c=ctx._chart;
    const dir = c.v.pending && c.v.pending.side==="A" ? "AB" : "BA";
    if(c.strip && c.strip.isConnected) drawStrip(c.strip,c.v,p,dir==="BA");
    if(c.cvs && c.cvs.isConnected && c.fold && c.fold.open) drawChart(c.cvs,c.A,c.B,p,dir);
    if(left<=0 && !ctx._reloading){ ctx._reloading=true; setTimeout(poll,1500); }
  }
  if(screen==="home"||screen==="mine"){
    const st=outboundState();
    if(st.kind==="drifting"||st.kind==="voyage"){
      const sig=(slotOut.textContent||"")+"|"+(slotIn.textContent||"");
      paintDock();
      // 실제로 글자가 바뀌지 않았다면 굳이 다시 그릴 필요가 없었다 (다음 초부터 건너뛴다)
      if(sig===((slotOut.textContent||"")+"|"+(slotIn.textContent||""))) tick.skip=(tick.skip||0)+1;
      else tick.skip=0;
    }
  }
}

/* ---------- 주기적 새로고침 ----------
   쓰던 편지를 지우지 않는다: 입력 중이면 화면을 다시 그리지 않는다. */
function isTyping(){
  const a=document.activeElement;
  if(a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT")) return true;
  const ta=stage.querySelector("textarea");
  return !!(ta && ta.value.trim());
}
function boardSig(){
  if(!board) return "";
  const st=board.stats||{};
  return JSON.stringify([
    board.registered, board.peek, st.drifting, st.sailing,
    board.boat && board.boat.id,
    (board.voyages||[]).map(v=>[v.id,(v.letters||[]).length,
      v.pending && v.pending.arrives_at, v.my_turn, v.closed, v.other_closed])
  ]);
}
async function poll(){
  if(!hasSession || Ocean.busy) return;
  try{
    const sigBefore=boardSig();
    const before=stage.querySelector(".win-body");
    const scrollTop=before?before.scrollTop:0;
    const openFolds=[...stage.querySelectorAll("details.fold")].map(d=>d.open);
    await refresh();
    ctx._reloading=false;
    // 쓰던 글이 있으면 화면을 갈아엎지 않는다
    if(isTyping()){ if(board&&board.registered&&!dock.hidden) paintDock(); return; }
    // 실제로 바뀐 게 없으면 그대로 둔다. 읽는 중에 화면이 튀지 않아야 한다.
    if(boardSig()===sigBefore){ if(!dock.hidden) paintDock(); return; }
    if(screen==="home") viewHome();
    else if(screen==="voyage"){ if(findVoyage(ctx.id)) viewVoyage(); else go("home"); }
    else if(screen==="mine") viewMine();
    else return;
    // 읽던 자리와 펼쳐둔 설명을 되돌린다
    const after=stage.querySelector(".win-body");
    if(after && scrollTop) after.scrollTop=scrollTop;
    const folds=[...stage.querySelectorAll("details.fold")];
    folds.forEach((d,i)=>{ if(openFolds[i]) d.open=true; });
  }catch(e){ /* 조용히 넘어간다 */ }
}

/* ============================================================
   7. 시작
   ============================================================ */
async function boot(){
  Ocean.start();

  // 소리 버튼
  const sbtn=$("#btnSound");
  sbtn.textContent="✕";
  sbtn.onclick=()=>Sea.toggle();
  const snap=()=>({screen:screen, ctx:Object.assign({},ctx)});
  $("#btnLog").onclick=()=>go("log",{back:snap()});
  $("#btnAbout").onclick=()=>go("about",{back:snap()});

  if(!window.supabase){ viewFatal("파도 소리는 나는데, 바다로 가는 길이 막혀 있어요. (라이브러리 로드 실패)"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:"dp.auth" }
  });

  // 저장된 열쇠가 "정말로" 죽었을 때만 새 열쇠를 만든다.
  async function reauth(){
    // signOut 을 먼저 하면, 새 열쇠 발급이 실패했을 때 있던 열쇠까지 잃는다.
    // 익명 로그인은 성공 시 알아서 세션을 교체하므로 그대로 시도한다.
    const {data,error}=await sb.auth.signInAnonymously();
    if(error) throw error;
    hasSession=true;
    return refresh();
  }

  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  hasSession=!!session;

  if(session){
    try{
      const d=await refresh();
      // 서버가 세션 없다고 답하면 그때만 열쇠를 새로 만든다
      if(d && d.ok===false && d.reason==="no_session"){
        try{ await reauth(); }
        catch(e2){ viewFatal(errMsg(e2)); return; }
      }
    }catch(e){
      if(isAuthError(e)){
        try{ await reauth(); }
        catch(e2){ viewFatal(errMsg(e2)); return; }
      }else{
        // 네트워크·서버 문제 — 열쇠는 절대 건드리지 않는다
        viewFatal(errMsg(e));
        return;
      }
    }
  }

  // 소리 설정 복원 (자동재생은 첫 클릭 이후에만)
  if(load(LS.sound,"")==="1"){
    const once=async()=>{ await Sea.toggle(true); removeEventListener("pointerdown",once); removeEventListener("keydown",once); };
    addEventListener("pointerdown",once,{once:true}); addEventListener("keydown",once,{once:true});
  }

  // 이어가기 링크(#k=…)
  if(await takeLinkKey()) { startTimers(); return; }

  if(board && board.registered){
    store(LS.nick, board.sailor.nick); store(LS.port, board.sailor.port);
    // 열쇠가 아직 없는 사람에게는 조용히 하나 만들어 붙여둔다
    if(!board.sailor.has_code || !load(LS.key,"")) { ensureKey().catch(()=>{}); }
    go("home");
  }else{
    go(load(LS.seen,"")==="1" ? "port" : "intro");
  }
  store(LS.seen,"1");

  startTimers();
}

let timersOn=false;
function startTimers(){
  if(timersOn) return;
  timersOn=true;
  tickTimer=setInterval(tick,1000);
  pollTimer=setInterval(()=>{ if(!document.hidden && hasSession) poll(); }, 30000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && hasSession) poll(); });
}

/* 주소창의 #k=… 를 소비한다. 페이지를 새로 읽지 않고 해시만 바뀌는 경우도 있어서
   hashchange 에서도 같은 처리를 한다. */
async function takeLinkKey(){
  const m=(location.hash||"").match(/[#&]k=([^&]+)/);
  if(!m) return false;
  let code;
  try{ code=decodeURIComponent(m[1]); }catch(e){ code=m[1]; }
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
  try{
    await ensureSession();
    const r=await rpc("dp_claim",{p_code:code});
    store(LS.key,code); store(LS.seen,"1");
    if(r&&r.nick) store(LS.nick,r.nick);
    if(r&&r.port) store(LS.port,r.port);
    await refresh();
    go("home");
    toast((r&&r.nick? r.nick+" · ":"")+"이어졌습니다.");
  }catch(e){
    store(LS.seen,"1");
    go("claim",{code:code, back:"intro"});
    toast(errMsg(e), true);
  }
  return true;
}
addEventListener("hashchange",()=>{ if(sb) takeLinkKey(); });

addEventListener("error",e=>{ console.error(e.error||e.message); });
/* og 이미지 제작용 (?og=1 일 때만 노출) */
if(new URLSearchParams(location.search).get("og")==="1") window.__og=drawCard;
boot();
})();
